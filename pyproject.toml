[build-system]
requires = ["setuptools>=79.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parliamentbench"
version = "0.1.0"
description = "ParliamentBench: Secret Hitler benchmark for LLM deception, persuasion, and reasoning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.99.3",
    "pyyaml>=6.0",
    "rich>=14.1.0",
]

[project.optional-dependencies]
# Needed only to re-run the post-hoc analyses in `analysis/`
# (`pip install -e ".[analysis]"`). The benchmark itself does not use them.
analysis = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
parliamentbench = "parliamentbench.benchmark:main"

[tool.setuptools]
packages = [
    "parliamentbench",
    "parliamentbench.players",
    "parliamentbench.metric",
]
include-package-data = true

[tool.setuptools.package-data]
parliamentbench = [
    "config.example.yaml",
]
